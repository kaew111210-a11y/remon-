<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>การงานงาน</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap');
:root{--ink:#17202d;--muted:#78818f;--line:#e8ebf0;--blue:#3867f4;--soft:#eef2ff;--green:#30b77a}*{box-sizing:border-box}body{margin:0;background:#fbfcfd;color:var(--ink);font-family:Prompt,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:flex}aside{width:250px;background:#fff;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 38px;font-size:20px;font-weight:700}.logo{width:34px;height:34px;display:grid;place-items:center;color:#fff;border-radius:11px;background:linear-gradient(135deg,#3867f4,#78a5ff);box-shadow:0 7px 16px #3867f433}.nav-label{color:#a1a7b1;font-size:11px;padding:0 14px 10px;letter-spacing:1px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{color:#7c8491;background:transparent;padding:12px 14px;text-align:left;border-radius:11px;display:flex;gap:12px;align-items:center;font-size:14px}.nav button.active{background:var(--soft);color:var(--blue);font-weight:600}.icon{width:19px;text-align:center;font-size:18px}.account-card{margin-top:auto;border-top:1px solid var(--line);padding:20px 9px 0}.account-title{color:#a1a7b1;font-size:11px;margin:0 5px 12px}.account-select{width:100%;background:#f7f8fb;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);outline:0}main{flex:1;max-width:1400px;padding:39px 5.5%;overflow:hidden}.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:35px}.eyebrow{color:var(--blue);font-size:12px;font-weight:600;margin-bottom:8px}h1{margin:0;font-size:30px;letter-spacing:-1px}.date{color:var(--muted);font-size:13px;margin-top:8px}.primary{display:flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border-radius:10px;padding:12px 18px;font-size:13px;font-weight:600;box-shadow:0 7px 14px #3867f42e}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:34px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 20px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:28px;font-weight:700;margin-top:8px}.work-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}h2{font-size:19px;margin:0}.view-all{color:var(--blue);background:none;font-size:12px}.filters{display:flex;gap:8px;margin-bottom:16px}.filter{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 13px;font-size:12px}.filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}.tasks{display:flex;flex-direction:column;gap:10px}.task{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px}.task.done{opacity:.62}.task.done .task-name{text-decoration:line-through;color:var(--muted)}.check{width:21px;height:21px;min-width:21px;border:1.5px solid #cbd0d9;border-radius:7px;background:#fff;color:#fff;padding:0}.check.checked{background:var(--green);border-color:var(--green)}.check.checked:after{content:'✓';font-size:13px}.task-main{flex:1;min-width:0}.task-name{font-size:14px;font-weight:600}.task-description{color:var(--muted);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{display:flex;align-items:center;gap:8px;margin-top:7px}.tag{border-radius:5px;padding:3px 7px;font-size:10px}.daily{color:#d5762b;background:#fff2e8}.once{color:#5b46ae;background:#f1edff}.owner{color:var(--muted);font-size:10px}.delete{color:#c5c9d1;background:none;padding:8px;font-size:16px}.empty{background:#fff;border:1px dashed #dce1e9;color:var(--muted);text-align:center;padding:42px 15px;border-radius:14px;font-size:13px}.modal-back{position:fixed;inset:0;background:#17202d66;display:none;place-items:center;z-index:5;padding:18px}.modal-back.show{display:grid}.modal{width:min(500px,100%);background:#fff;border-radius:18px;padding:27px}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modal h2{font-size:21px}.close{background:#f3f5f8;color:#78818f;width:30px;height:30px;border-radius:8px}.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #e1e5ec;border-radius:9px;padding:10px 12px;outline:0;color:var(--ink);background:#fff;font-size:13px}.field textarea{resize:vertical;min-height:75px}.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:1px solid var(--line);border-radius:9px;padding:11px;font-size:12px;background:#fff;text-align:left}.choice.selected{background:var(--soft);border-color:#9fb3ff;color:var(--blue)}.submit{width:100%;margin-top:7px;justify-content:center}@media(max-width:800px){aside{width:70px;padding:22px 10px}.brand{padding:0 7px 35px}.brand span,.nav-label,.nav button span,.account-card{display:none}.nav button{justify-content:center;padding:12px 0}main{padding:28px 20px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){main{padding:24px 15px}.topbar{display:block}.topbar .primary{margin-top:20px}.task{padding:13px 12px}}
</style></head><body>
<div class="app"><aside><div class="brand"><div class="logo">✓</div><span>การงานงาน</span></div><div class="nav-label">เมนูหลัก</div><nav class="nav"><button class="active" data-page="all"><span class="icon">▦</span><span>งานทั้งหมด</span></button><button data-page="today"><span class="icon">◷</span><span>งานวันนี้</span></button><button data-page="daily"><span class="icon">↻</span><span>งานประจำวัน</span></button></nav><div class="account-card"><p class="account-title">แสดงงานของบัญชี</p><select class="account-select" id="accountFilter"><option value="all">ทุกบัญชี</option><option value="แก้ว">แก้ว</option><option value="อุ้ย">อุ้ย</option></select></div></aside>
<main><div class="topbar"><div><div class="eyebrow">สวัสดี 👋</div><h1>จัดการงานของคุณ</h1><div class="date" id="todayDate"></div></div><button class="primary" id="openModal">＋ สร้างงานใหม่</button></div><section class="stats"><div class="stat"><div class="stat-label">งานที่ยังไม่เสร็จ</div><div class="stat-value" id="statOpen">0</div></div><div class="stat"><div class="stat-label">งานที่ต้องทำวันนี้</div><div class="stat-value" id="statToday">0</div></div><div class="stat"><div class="stat-label">เสร็จแล้ว</div><div class="stat-value" id="statDone">0</div></div><div class="stat"><div class="stat-label">งานประจำวัน</div><div class="stat-value" id="statDaily">0</div></div></section><div class="work-head"><h2 id="listTitle">งานทั้งหมด</h2><button class="view-all" id="clearDone">ลบงานที่เสร็จแล้ว</button></div><div class="filters"><button class="filter active" data-filter="all">ทั้งหมด</button><button class="filter" data-filter="open">ยังไม่เสร็จ</button><button class="filter" data-filter="done">เสร็จแล้ว</button></div><div id="taskList" class="tasks"></div></main></div>
<div class="modal-back" id="modalBack"><form class="modal" id="taskForm"><div class="modal-top"><h2>สร้างงานใหม่</h2><button type="button" class="close" id="closeModal">×</button></div><div class="field"><label for="taskName">ชื่องาน *</label><input id="taskName" required placeholder="เช่น ส่งรายงานประจำสัปดาห์"></div><div class="field"><label for="taskDesc">รายละเอียดงาน</label><textarea id="taskDesc" placeholder="เพิ่มรายละเอียด หรือโน้ตเกี่ยวกับงานนี้"></textarea></div><div class="field"><label>ประเภทงาน</label><div class="choice-row"><button type="button" class="choice selected" data-type="once">◷ งานครั้งเดียว<br><small>ทำจนกว่าจะเสร็จ</small></button><button type="button" class="choice" data-type="daily">↻ งานประจำวัน<br><small>ทำซ้ำทุกวัน</small></button></div></div><div class="field"><label for="taskOwner">งานนี้เป็นของบัญชี</label><select id="taskOwner"><option value="แก้ว">แก้ว</option><option value="อุ้ย">อุ้ย</option></select></div><button class="primary submit" type="submit">สร้างงาน</button></form></div>
<script>
const seed=[{id:1,name:'เช็กอีเมลและข้อความ',desc:'ตรวจสอบข้อความสำคัญประจำวัน',type:'daily',owner:'แก้ว',done:false},{id:2,name:'เตรียมเอกสารประชุม',desc:'รวบรวมข้อมูลและสรุปประเด็น',type:'once',owner:'อุ้ย',done:false},{id:3,name:'อัปเดตค่าใช้จ่ายประจำเดือน',desc:'ตรวจสอบใบเสร็จทั้งหมด',type:'once',owner:'แก้ว',done:true}];let tasks=JSON.parse(localStorage.getItem('workTasks')||'null')||seed,currentPage='all',currentFilter='all',newType='once';const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));$('#todayDate').textContent=new Intl.DateTimeFormat('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());function save(){localStorage.setItem('workTasks',JSON.stringify(tasks));render()}function render(){const owner=$('#accountFilter').value;let view=tasks.filter(t=>owner==='all'||t.owner===owner);if(currentPage==='today')view=view.filter(t=>!t.done);if(currentPage==='daily')view=view.filter(t=>t.type==='daily');if(currentFilter==='open')view=view.filter(t=>!t.done);if(currentFilter==='done')view=view.filter(t=>t.done);$('#taskList').innerHTML=view.length?view.map(t=>`<div class="task ${t.done?'done':''}"><button class="check ${t.done?'checked':''}" onclick="toggleTask(${t.id})"></button><div class="task-main"><div class="task-name">${esc(t.name)}</div><div class="task-description">${esc(t.desc)||'ไม่มีรายละเอียด'}</div><div class="task-meta"><span class="tag ${t.type}">${t.type==='daily'?'↻ ประจำวัน':'◷ ครั้งเดียว'}</span><span class="owner">บัญชี: ${esc(t.owner)}</span></div></div><button class="delete" onclick="deleteTask(${t.id})">⌫</button></div>`).join(''):'<div class="empty">ยังไม่มีงานในรายการนี้<br><small>กด “สร้างงานใหม่” เพื่อเริ่มต้น</small></div>';const a=tasks.filter(t=>owner==='all'||t.owner===owner);$('#statOpen').textContent=a.filter(t=>!t.done).length;$('#statToday').textContent=a.filter(t=>!t.done).length;$('#statDone').textContent=a.filter(t=>t.done).length;$('#statDaily').textContent=a.filter(t=>t.type==='daily').length}window.toggleTask=id=>{const t=tasks.find(x=>x.id===id);t.done=!t.done;save()};window.deleteTask=id=>{tasks=tasks.filter(x=>x.id!==id);save()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentPage=b.dataset.page;$('#listTitle').textContent={all:'งานทั้งหมด',today:'งานวันนี้',daily:'งานประจำวัน'}[currentPage];render()});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()});$('#accountFilter').onchange=render;$('#openModal').onclick=()=>$('#modalBack').classList.add('show');$('#closeModal').onclick=()=>$('#modalBack').classList.remove('show');$('#modalBack').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show')};document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');newType=b.dataset.type});$('#taskForm').onsubmit=e=>{e.preventDefault();tasks.unshift({id:Date.now(),name:$('#taskName').value.trim(),desc:$('#taskDesc').value.trim(),type:newType,owner:$('#taskOwner').value,done:false});save();e.target.reset();newType='once';document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x.dataset.type==='once'));$('#modalBack').classList.remove('show')};$('#clearDone').onclick=()=>{tasks=tasks.filter(t=>!t.done);save()};render();
</script>
<script>
// Google Sheets sync: paste the deployed Apps Script Web App URL into the prompt.
const GOOGLE_URL_KEY='googleSheetsWebAppUrl';
function googleUrl(){return localStorage.getItem(GOOGLE_URL_KEY)||''}
function syncGoogle(){
  let url=googleUrl();
  if(!url){url=prompt('วาง URL ของ Google Apps Script Web App ที่นี่');if(!url)return;localStorage.setItem(GOOGLE_URL_KEY,url.trim())}
  const btn=document.getElementById('syncBtn'); if(btn)btn.textContent='กำลังซิงก์...';
  fetch(url,{method:'POST',body:JSON.stringify({tasks})}).then(r=>r.json()).then(()=>alert('ซิงก์ข้อมูลขึ้น Google Sheets แล้ว')).catch(()=>alert('ซิงก์ไม่สำเร็จ กรุณาตรวจสอบ URL และสิทธิ์การเข้าถึง')).finally(()=>{if(btn)btn.textContent='↕ ซิงก์ Google Sheets'})
}
function addGoogleButton(){
  const top=document.querySelector('.topbar');if(!top||document.getElementById('syncBtn'))return;
  const group=document.createElement('div');group.style='display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end';
  const sync=document.createElement('button');sync.id='syncBtn';sync.className='filter';sync.textContent='↕ ซิงก์ Google Sheets';sync.onclick=syncGoogle;
  const settings=document.createElement('button');settings.className='filter';settings.textContent='⚙ ตั้งค่า';settings.onclick=()=>{const next=prompt('URL Google Apps Script Web App',googleUrl());if(next!==null)localStorage.setItem(GOOGLE_URL_KEY,next.trim())};
  const create=document.getElementById('openModal');group.append(sync,settings,create);top.append(group)
}
addGoogleButton();
</script></body></html>
